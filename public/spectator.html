<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>少年剣道大会 速報</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
    let tournamentMatches = []; // 👈 ★追加: 決勝トーナメントの対戦データ保持用
    <style>
        .modal-scroll {
            max-height: calc(88vh - 100px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- ナビバー -->
    <header class="bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-black flex items-center gap-2">
                ⚔️ 少年剣道大会 速報
            </h1>
            <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> リアルタイム同期中
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-3 sm:p-6 space-y-4">
        <!-- ★部門切り替えタブ（常時表示） -->
        <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 items-center" id="spectatorCategoryNav">
            <span class="text-xs font-black text-slate-400 px-2">部門選択:</span>
            <button onclick="switchCategory('小学生低学年')" id="spec-btn-小学生低学年" class="spec-cat-btn px-4 py-2 rounded-xl font-black text-xs sm:text-sm transition bg-indigo-600 text-white shadow-sm">① 小学生低学年</button>
            <button onclick="switchCategory('小学生高学年')" id="spec-btn-小学生高学年" class="spec-cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600 hover:bg-slate-200">② 小学生高学年</button>
            <button onclick="switchCategory('中学生団体')" id="spec-btn-中学生団体" class="spec-cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600 hover:bg-slate-200">③ 中学生団体</button>
            <button onclick="switchCategory('中学生女子団体')" id="spec-btn-中学生女子団体" class="spec-cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600 hover:bg-slate-200">④ 中学生女子団体</button>
        </div>

        <!-- 試合カード一覧 -->
        <!-- ★追加: 表示モード切替タブ (予選 / 決勝 / 最終結果) -->
        <div class="flex justify-center gap-2 border-b border-slate-200 pb-2">
            <button onclick="switchTab('yosen')" id="tab-btn-yosen" class="tab-btn px-4 py-2 rounded-lg font-black text-xs sm:text-sm bg-indigo-600 text-white shadow-sm">予選リーグ</button>
            <button onclick="goToTournamentPage()" class="tab-btn px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-white text-slate-600 hover:bg-slate-100 border">🏆 決勝トーナメント</button>
            <button onclick="switchTab('result')" id="tab-btn-result" class="tab-btn px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-white text-slate-600 hover:bg-slate-100 border">🏆 最終結果</button>
        </div>

        <!-- 1. 予選リーグ表示エリア (既存のコンテナ) -->
        <div id="view-yosen" class="space-y-6 pt-2">
            <div id="spectatorContainer" class="space-y-6">
                <div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">速報データを読み込み中...</div>
            </div>
        </div>

        <!-- 2. 決勝トーナメント表示エリア (追加) -->
        <div id="view-tournament" class="space-y-6 pt-2 hidden">
            <div id="tournamentContainer" class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">
                決勝トーナメント情報を読み込み中...
            </div>
        </div>

        <!-- 3. 最終結果（表彰）表示エリア (追加) -->
        <div id="view-result" class="space-y-6 pt-2 hidden">
            <div id="finalResultContainer" class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">
                大会結果を読み込み中...
            </div>
        </div>
    </main>

    <!-- 対戦詳細モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="bg-indigo-900 text-white p-3 sm:p-4 flex justify-between items-center shrink-0">
                <h3 id="modalTitle" class="font-bold text-base sm:text-lg">試合詳細</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>

            <div class="p-4 modal-scroll space-y-4">
                <div class="bg-slate-100 rounded-xl p-3 border border-slate-200 flex justify-between items-center text-center">
                    <div class="w-5/12">
                        <div id="modalRedTeam" class="font-black text-sm sm:text-base text-red-700 truncate">赤チーム</div>
                        <div id="modalRedSummary" class="text-xs text-red-600 font-bold mt-0.5">0勝 (0本)</div>
                    </div>
                    <div class="w-2/12 flex flex-col items-center">
                        <span class="font-black text-xs text-slate-400">VS</span>
                        <span id="modalResultBadge" class="mt-1 text-[11px] px-2 py-0.5 font-black rounded border bg-slate-200 text-slate-600">未実施</span>
                    </div>
                    <div class="w-5/12">
                        <div id="modalWhiteTeam" class="font-black text-sm sm:text-base text-slate-800 truncate">白チーム</div>
                        <div id="modalWhiteSummary" class="text-xs text-slate-600 font-bold mt-0.5">0勝 (0本)</div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-xs sm:text-sm border-collapse min-w-[400px]">
                        <thead>
                            <tr class="border-b bg-slate-50 text-slate-500 font-bold">
                                <th class="p-2 w-14 text-center">位置</th>
                                <th class="p-2 text-center">赤 取得部位</th>
                                <th class="p-2 w-20 text-center">勝敗</th>
                                <th class="p-2 text-center">白 取得部位</th>
                            </tr>
                        </thead>
                        <tbody id="modalPositionRows"></tbody>
                    </table>
                </div>
            </div>

            <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
                <button onclick="closeModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs sm:text-sm font-bold text-slate-700">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const positions = ['先鋒', '次鋒', '中堅', '副将', '大将'];
        let currentCategory = '小学生低学年';
        let currentTab = 'yosen'; // 👈 ★追加: 現在開いているタブ
        let spectatorMatches = [];
        let finalResultData = null; // 👈 ★追加: 最終結果データ保存用

        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-lg font-bold text-xs sm:text-sm bg-white text-slate-600 hover:bg-slate-100 border";
            });
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            if (activeBtn) {
                activeBtn.className = "tab-btn px-4 py-2 rounded-lg font-black text-xs sm:text-sm bg-indigo-600 text-white shadow-sm";
            }

            // 表示エリアの出し分け
            document.getElementById('view-yosen').classList.toggle('hidden', tabName !== 'yosen');
            document.getElementById('view-tournament').classList.toggle('hidden', tabName !== 'tournament');
            document.getElementById('view-result').classList.toggle('hidden', tabName !== 'result');

            renderSpectatorView();
        }

        // 👈 ★追加: 現在の選択カテゴリを持って決勝トーナメント専用ページへ移動
        function goToTournamentPage() {
            const catKey = categoryKeyMap[currentCategory] || 'low_elem';
            window.location.href = `spectator_tournament.html?category=${catKey}`;
        }

        function updateCategoryTabUi() {
            document.querySelectorAll('.spec-cat-btn').forEach(btn => {
                btn.className = "spec-cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600 hover:bg-slate-200";
            });
            const activeBtn = document.getElementById(`spec-btn-${currentCategory}`);
            if (activeBtn) {
                activeBtn.className = "spec-cat-btn px-4 py-2 rounded-xl font-black text-xs sm:text-sm transition bg-indigo-600 text-white shadow-sm";
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            updateCategoryTabUi();
            fetchSpectatorData();
        }

        // 部門名（和名）と英名キーのマッピング
        const categoryKeyMap = {
            '小学生低学年': 'low_elem',
            '小学生高学年': 'elem',     // 👈 「小学生高学年」に修正（または追加）
            '小学生団体': 'elem',       // （念のため残しておいてもOKです）
            '中学生団体': 'mid',
            '中学生女子団体': 'mid_girls'
        };

        async function fetchSpectatorData() {
            let savedMap = new Map();
            let rawMatches = [];
            const keyName = categoryKeyMap[currentCategory] || currentCategory;

            // LocalStorage のフォールバックデータ取得
            let localSaved = [];
            try {
                const rawLocal = localStorage.getItem(`kendo_matches_${keyName}`) || 
                                 localStorage.getItem(`kendo_matches_${currentCategory}`) || 
                                 localStorage.getItem('kendo_matches');
                localSaved = JSON.parse(rawLocal) || [];
            } catch(e) {}

            // API (Supabase) から対戦一覧を取得し、選択中カテゴリでフィルタリング
            try {
                const res = await fetch('/api/matches');
                if (res.ok) {
                    const allMatches = await res.json();
                    const catKey = categoryKeyMap[currentCategory] || currentCategory;
                    rawMatches = allMatches.filter(m => {
                        const matchCat = normalizeCategoryKey(m.category || m.category_key);
                        const targetCat = normalizeCategoryKey(currentCategory);
                        return matchCat === targetCat;
                    });
                }
            } catch (e) {
                rawMatches = localSaved;
            }

            // スコア復元用マップ作成
            localSaved.forEach(m => {
                const k1 = `${m.category || currentCategory}_${m.league}_${m.teamA || m.redTeam}_${m.teamB || m.whiteTeam}`;
                savedMap.set(k1, m);
            });

            let cleanMatches = [];

            // Supabaseにデータが存在する場合はそれを最優先で利用（赤白配置・試合順をそのまま保持）
            if (rawMatches && rawMatches.length > 0) {
                rawMatches.forEach((m, idx) => {
                    const redTeam = m.teamA || m.team_a || m.redTeam || (m.teams && m.teams[0]) || '赤チーム';
                    const whiteTeam = m.teamB || m.team_b || m.whiteTeam || (m.teams && m.teams[1]) || '白チーム';
                    
                    let rawLeague = m.league || m.league_name || m.stage || '';
                    let league = 'Aリーグ';
                    const leagueMatch = (rawLeague + ' ' + (m.title || '')).match(/([A-ZＡ-Ｚa-zａ-ｚ1-9１-９]+リーグ)/);
                    if (leagueMatch) league = leagueMatch[1];
                    else if (rawLeague && rawLeague !== '予選リーグ') league = rawLeague;

                    const lookupKey = `${m.category || currentCategory}_${league}_${redTeam}_${whiteTeam}`;
                    const saved = savedMap.get(lookupKey);

                    // 💡 Supabaseの details (または positions) から先鋒〜大将のデータを安全に取り出す
                    let extractedPositions = null;
                    
                    // 1. m.details が存在する場合の安全なパース
                    if (m.details) {
                        let rawDet = typeof m.details === 'string' ? JSON.parse(m.details) : m.details;
                        if (Array.isArray(rawDet)) {
                            extractedPositions = rawDet;
                        } else if (rawDet && Array.isArray(rawDet.order_list)) {
                            extractedPositions = rawDet.order_list;
                        }
                    }

                    // 2. details が無ければ m.positions を確認
                    if (!extractedPositions && m.positions) {
                        extractedPositions = typeof m.positions === 'string' ? JSON.parse(m.positions) : m.positions;
                    }

                    // 3. データが存在しない場合の初期化用デフォルトデータ
                    const defaultPosData = positions.map(p => ({ position: p, red: [], white: [], result: '引分' }));

                    cleanMatches.push({
                        ...m,
                        id: m.id || `${league}_m${idx + 1}`,
                        category: currentCategory,
                        league: league,
                        title: m.title || `第${idx + 1}試合`,
                        redTeam: redTeam,
                        whiteTeam: whiteTeam,
                        isFinished: (saved && saved.isFinished) || m.isFinished || m.status === 'finished' || false,
                        positions: (saved && saved.positions) || extractedPositions || defaultPosData
                    });
                });
            } else {
                // APIにデータがない場合のみ、ブロック構造からフォールバック生成
                const leagueBlocks = getLeagueBlocksFromStorage(currentCategory);
                leagueBlocks.forEach(block => {
                    const leagueName = block.league;
                    const teams = block.teams || [];
                    if (teams.length >= 2) {
                        let matchIndex = 1;
                        for (let i = 0; i < teams.length; i++) {
                            for (let j = i + 1; j < teams.length; j++) {
                                const teamA = teams[i];
                                const teamB = teams[j];
                                const matchId = `${leagueName}_m${matchIndex}`;
                                const lookupKey = `${currentCategory}_${leagueName}_${teamA}_${teamB}`;
                                const saved = savedMap.get(lookupKey);

                                cleanMatches.push({
                                    id: matchId,
                                    category: currentCategory,
                                    league: leagueName,
                                    title: `第${matchIndex}試合`,
                                    redTeam: teamA,
                                    whiteTeam: teamB,
                                    isFinished: saved ? saved.isFinished : false,
                                    positions: saved ? saved.positions : positions.map(p => ({ position: p, red: [], white: [], result: '引分' }))
                                });
                                matchIndex++;
                            }
                        }
                    }
                });
            }

            spectatorMatches = cleanMatches;
            
            // 👈 ★追加: admin_finish.html から配信された「結果データ」の読み込み
            try {
                const finishRaw = localStorage.getItem(`kendo_finish_result_${keyName}`) ||
                                  localStorage.getItem(`kendo_finish_result_${currentCategory}`);
                finalResultData = finishRaw ? JSON.parse(finishRaw) : null;
            } catch(e) {
                finalResultData = null;
            }
            loadTournamentData(keyName); // 👈 ★追加: 決勝トーナメントデータの安全な読み込み
            loadTournamentData(keyName); // 👈 ★追加: 決勝トーナメントデータの安全な読み込み

            // 💡 ★ここに追加: 予選リーグの画面から「決勝トーナメント系の試合」を除外する安全フィルター
            spectatorMatches = spectatorMatches.filter(m => {
                const lgTitle = (m.league || '') + ' ' + (m.title || '') + ' ' + (m.stage || '');
                return !(/[1-9１-９]回戦|準決勝|決勝|トーナメント/.test(lgTitle) && !lgTitle.includes('予選'));
            });

            renderSpectatorView();
        }

        function getLeagueBlocksFromStorage(cat) {
            const keyName = categoryKeyMap[cat] || cat;
            const saved = localStorage.getItem(`kendo_league_blocks_${keyName}`) || 
                          localStorage.getItem(`kendo_league_blocks_${cat}`) || 
                          localStorage.getItem('kendo_league_blocks');
                          
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed.map(b => ({
                            league: b.league || b.name || b.league_name || 'Aリーグ',
                            teams: (b.teams || b.members || []).map(t => typeof t === 'string' ? t : (t.name || t.team_name))
                        }));
                    }
                } catch(e) {}
            }

            return [];
        }

        function calculatePosResult(redPts, whitePts) {
            let redCount = (redPts || []).filter(p => p !== '▲' && p !== 'CLEAR' && p !== '引分').length;
            let whiteCount = (whitePts || []).filter(p => p !== '▲' && p !== 'CLEAR' && p !== '引分').length;

            const redFouls = (redPts || []).filter(p => p === '▲').length;
            const whiteFouls = (whitePts || []).filter(p => p === '▲').length;

            whiteCount += Math.floor(redFouls / 2);
            redCount += Math.floor(whiteFouls / 2);

            if (redCount > whiteCount) return { text: '赤勝ち', class: 'bg-red-100 text-red-700 border-red-300', redPts: redCount, whitePts: whiteCount };
            if (whiteCount > redCount) return { text: '白勝ち', class: 'bg-indigo-100 text-indigo-700 border-indigo-300', redPts: redCount, whitePts: whiteCount };
            return { text: '引分', class: 'bg-amber-50 text-amber-700 border-amber-200', redPts: redCount, whitePts: whiteCount };
        }

        function calculateTeamSummary(positionsData) {
            let redWins = 0, whiteWins = 0, draws = 0;
            let redTotalPts = 0, whiteTotalPts = 0;
            let hasInput = false;

            (positionsData || []).forEach(pos => {
                const res = calculatePosResult(pos.red, pos.white);
                redTotalPts += res.redPts;
                whiteTotalPts += res.whitePts;

                if ((pos.red && pos.red.length > 0) || (pos.white && pos.white.length > 0)) hasInput = true;

                if (res.text === '赤勝ち') redWins++;
                else if (res.text === '白勝ち') whiteWins++;
                else draws++;
            });

            if (!hasInput) return { status: '未実施', hasInput: false, redWins: 0, whiteWins: 0, redTotalPts: 0, whiteTotalPts: 0 };

            let status = '引分';
            if (redWins > whiteWins) status = '赤勝ち';
            else if (whiteWins > redWins) status = '白勝ち';
            else {
                if (redTotalPts > whiteTotalPts) status = '赤勝ち';
                else if (whiteTotalPts > redTotalPts) status = '白勝ち';
                else status = '引分';
            }

            return { status, hasInput: true, redWins, whiteWins, redTotalPts, whiteTotalPts, draws };
        }

        function renderSpectatorView() {
            // ① 最終結果タブの描画
            renderFinalResultView();

            // ② 決勝トーナメントタブの描画（現時点では仮プレースホルダー）
            renderTournamentView();

            // ③　予選リーグの描画（既存のコードの処理はそのまま維持)
            const container = document.getElementById('spectatorContainer');
            if (!spectatorMatches || spectatorMatches.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 font-bold bg-white rounded-xl">対戦データがありません</div>';
                return;
            }

            const grouped = {};
            spectatorMatches.forEach((m, idx) => {
                m._idx = idx;
                if (!grouped[m.league]) grouped[m.league] = [];
                grouped[m.league].push(m);
            });

            const sortedLeagues = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'ja'));

            container.innerHTML = sortedLeagues.map(leagueName => {
                const matches = grouped[leagueName];
                matches.sort((a, b) => a.title.localeCompare(b.title, 'ja', { numeric: true }));

                return `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200">
                        <div class="flex items-center gap-2 mb-3 border-b border-slate-100 pb-2">
                            <span class="w-3 h-5 bg-indigo-600 rounded-full inline-block"></span>
                            <h3 class="text-base sm:text-lg font-black text-slate-900">${leagueName} <span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full font-bold ml-1 border border-indigo-100">${currentCategory}</span></h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${matches.map(m => renderMatchCardHtml(m)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 🏆 最終結果タブ 描画関数（強化版：空振り防止＆自動フォールバック機能付き）
        // ==========================================
        async function renderFinalResultView() {
            const container = document.getElementById('finalResultContainer');
            if (!container) return;

            // ① ローディング表示
            container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">最新の結果を読み込み中...</div>`;

            try {
                // ② サーバーへ結果をリクエスト（全件・個別どちらも処理できるようにまずはリクエスト）
                const res = await fetch(`/api/results?category=${encodeURIComponent(currentCategory)}`);
                let finalResultData = await res.json();

                // 【安全フォールバック】もしID指定でデータが空だった場合、全結果から「現在の部門名」に合致するものか、最新1件を取得する
                if (!finalResultData || (!finalResultData.winner && !finalResultData.title)) {
                    console.log('[結果デバッグ] 個別取得が空だったため、全結果一覧から再確認します...');
                    const allRes = await fetch('/api/results');
                    const allData = await allRes.json();
                    
                    if (Array.isArray(allData) && allData.length > 0) {
                        // 同じ category または現在選択中の部門のものがあれば優先、なければ直近に更新されたものを拾う
                        finalResultData = allData.find(d => d.category === currentCategory) 
                                      || allData.find(d => (d.title || '').includes(currentCategory))
                                      || allData[allData.length - 1];
                    }
                }

                console.log('[結果デバッグ] 最終的に描画するデータ:', finalResultData);

                // ③ それでもデータが無い場合のみ「配信未完了」と表示
                if (!finalResultData || !finalResultData.winner) {
                    container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">まだ最終結果は配信されていません</div>`;
                    return;
                }

                // ④ 表彰カードの描画（サーバーのキー名: runner_up / third_place_1 に完全対応！）
                container.innerHTML = `
                    <div class="bg-gradient-to-br from-amber-50 to-white rounded-2xl p-6 border-2 border-amber-300 shadow-lg text-center max-w-xl mx-auto space-y-6">
                        <div class="border-b border-amber-200 pb-3">
                            <span class="text-xs font-black px-3 py-1 bg-amber-500 text-white rounded-full">大会最終結果</span>
                            <h2 class="text-xl font-black text-slate-900 mt-2">${finalResultData.title || currentCategory}</h2>
                            <p class="text-xs font-bold text-slate-500 mt-1">
                                ${finalResultData.status === 'completed' ? '🏆 全試合終了 (結果発表)' : '⚔️ 試合進行中'}
                            </p>
                        </div>

                        <div class="space-y-3">
                            <div class="bg-amber-100/50 border border-amber-300 p-4 rounded-xl flex items-center gap-4">
                                <span class="text-3xl">🥇</span>
                                <div class="text-left">
                                    <div class="text-xs font-bold text-amber-800">優勝</div>
                                    <div class="text-lg font-black text-slate-900">${finalResultData.winner || '未発表'}</div>
                                </div>
                            </div>

                            <div class="bg-slate-100 border border-slate-300 p-4 rounded-xl flex items-center gap-4">
                                <span class="text-3xl">🥈</span>
                                <div class="text-left">
                                    <div class="text-xs font-bold text-slate-600">準優勝</div>
                                    <div class="text-lg font-black text-slate-900">${finalResultData.runner_up || '未発表'}</div>
                                </div>
                            </div>

                            <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl flex items-center gap-4">
                                <span class="text-3xl">🥉</span>
                                <div class="text-left">
                                    <div class="text-xs font-bold text-orange-800">第3位</div>
                                    <div class="text-lg font-black text-slate-900">
                                        ${finalResultData.third_place_1 || '未発表'}
                                        ${finalResultData.third_place_2 ? ` / ${finalResultData.third_place_2}` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('最終結果描画エラー:', err);
                container.innerHTML = `<div class="text-center py-12 text-red-500 font-bold bg-white rounded-2xl border">結果の読み込みに失敗しました</div>`;
            }
        }

        // 👈 ★追加: 決勝トーナメントデータ専用の読み込み関数（独立させてシンプルに管理）
        function loadTournamentData(keyName) {
            tournamentMatches = [];
            
            // 1. トーナメント専用ストレージまたは統合データからの抽出
            try {
                const rawTourney = localStorage.getItem(`kendo_tournament_matches_${keyName}`) ||
                                   localStorage.getItem(`kendo_tournament_${keyName}`) ||
                                   localStorage.getItem(`kendo_tournament_matches_${currentCategory}`);
                if (rawTourney) {
                    const parsed = JSON.parse(rawTourney);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        tournamentMatches = parsed;
                        return;
                    }
                }
            } catch(e) {}

            // 2. ストレージに無い場合、既存の対戦リストから「〇〇リーグ」以外の試合（1回戦、準決勝、決勝など）を自動抽出
            tournamentMatches = spectatorMatches.filter(m => {
                const lg = m.league || '';
                return !lg.includes('リーグ') && lg !== '予選リーグ' && lg !== '';
            });
        }

        // 👈 ★差し替え: 決勝トーナメントの描画関数
        function renderTournamentView() {
            const container = document.getElementById('tournamentContainer');
            if (!tournamentMatches || tournamentMatches.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">決勝トーナメントの対戦データがまだありません</div>`;
                return;
            }

            // 回戦ごと（例: 1回戦, 準決勝, 決勝）にグループ化
            const groupedTourney = {};
            tournamentMatches.forEach((m, idx) => {
                // 既存のモーダルで開けるように全体のインデックスも付与
                m._idx = spectatorMatches.indexOf(m);
                const stageName = m.league || m.stage || '決勝トーナメント';
                if (!groupedTourney[stageName]) groupedTourney[stageName] = [];
                groupedTourney[stageName].push(m);
            });

            const stageOrder = ['1回戦', '2回戦', '3回戦', '準々決勝', '準決勝', '決勝'];
            const sortedStages = Object.keys(groupedTourney).sort((a, b) => {
                const idxA = stageOrder.indexOf(a);
                const idxB = stageOrder.indexOf(b);
                if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                return a.localeCompare(b, 'ja');
            });

            container.innerHTML = sortedStages.map(stageName => {
                const matches = groupedTourney[stageName];
                return `
                    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 text-left">
                        <div class="flex items-center gap-2 mb-3 border-b border-slate-100 pb-2">
                            <span class="w-3 h-5 bg-amber-500 rounded-full inline-block"></span>
                            <h3 class="text-base sm:text-lg font-black text-slate-900">${stageName} <span class="text-xs text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full font-bold ml-1 border border-amber-200">${currentCategory}</span></h3>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${matches.map(m => renderMatchCardHtml(m)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMatchCardHtml(m) {
            const summary = calculateTeamSummary(m.positions);
            const isFinished = m.isFinished || (summary.hasInput && summary.status !== '未実施');

            let badgeHtml = `<span class="bg-slate-100 text-slate-500 text-[11px] px-2.5 py-0.5 rounded font-bold">試合前</span>`;
            let winnerText = "";
            let cardBg = "bg-white border-slate-200";

            if (isFinished) {
                cardBg = "bg-slate-50 border-slate-300";
                if (summary.status === '赤勝ち') {
                    badgeHtml = `<span class="bg-red-600 text-white text-[11px] px-2.5 py-0.5 rounded-full font-black">試合終了</span>`;
                    winnerText = `<div class="text-xs font-black text-red-600 truncate mt-1">🔴 勝者: ${m.redTeam}</div>`;
                } else if (summary.status === '白勝ち') {
                    badgeHtml = `<span class="bg-indigo-700 text-white text-[11px] px-2.5 py-0.5 rounded-full font-black">試合終了</span>`;
                    winnerText = `<div class="text-xs font-black text-indigo-800 truncate mt-1">⚪ 勝者: ${m.whiteTeam}</div>`;
                } else {
                    badgeHtml = `<span class="bg-amber-600 text-white text-[11px] px-2.5 py-0.5 rounded-full font-black">試合終了</span>`;
                    winnerText = `<div class="text-xs font-bold text-amber-700 mt-1">🤝 引き分け</div>`;
                }
            }

            return `
                <div class="p-3.5 rounded-xl border ${cardBg} shadow-xs cursor-pointer hover:border-indigo-300 transition" onclick="openDetailModal(${m._idx})">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                        <span>${m.title}</span>
                        ${badgeHtml}
                    </div>
                    <div class="flex justify-between items-center text-center my-1.5">
                        <div class="w-5/12 font-black text-sm text-slate-800 truncate">${m.redTeam}</div>
                        <div class="w-2/12 text-xs font-black text-slate-300">VS</div>
                        <div class="w-5/12 font-black text-sm text-slate-800 truncate">${m.whiteTeam}</div>
                    </div>
                    <div class="text-center">
                        ${winnerText || '<span class="text-[11px] text-indigo-600 font-bold">タップして詳細を見る</span>'}
                    </div>
                </div>
            `;
        }

        function openDetailModal(idx) {
            const match = spectatorMatches[idx];
            const summary = calculateTeamSummary(match.positions);

            document.getElementById('modalTitle').innerText = `${currentCategory} ${match.league} ${match.title}`;
            document.getElementById('modalRedTeam').innerText = match.redTeam;
            document.getElementById('modalWhiteTeam').innerText = match.whiteTeam;
            document.getElementById('modalRedSummary').innerText = `${summary.redWins}勝 (${summary.redTotalPts}本)`;
            document.getElementById('modalWhiteSummary').innerText = `${summary.whiteWins}勝 (${summary.whiteTotalPts}本)`;

            const badge = document.getElementById('modalResultBadge');
            if (summary.status === '赤勝ち') {
                badge.className = "mt-1 text-[11px] px-2 py-0.5 font-black rounded border bg-red-100 text-red-700 border-red-300";
                badge.innerText = "🔴 赤勝ち";
            } else if (summary.status === '白勝ち') {
                badge.className = "mt-1 text-[11px] px-2 py-0.5 font-black rounded border bg-indigo-100 text-indigo-800 border-indigo-300";
                badge.innerText = "⚪ 白勝ち";
            } else if (summary.status === '引分') {
                badge.className = "mt-1 text-[11px] px-2 py-0.5 font-black rounded border bg-amber-100 text-amber-800 border-amber-300";
                badge.innerText = "🤝 引分け";
            } else {
                badge.className = "mt-1 text-[11px] px-2 py-0.5 font-black rounded border bg-slate-200 text-slate-600";
                badge.innerText = "未実施";
            }

            const tbody = document.getElementById('modalPositionRows');
            tbody.innerHTML = '';

            positions.forEach((pName, pIdx) => {
                const pos = (match.positions && match.positions[pIdx]) || { red: [], white: [] };
                const res = calculatePosResult(pos.red, pos.white);

                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="p-2 font-bold text-center bg-slate-100 text-slate-700">${pName}</td>
                    <td class="p-2 text-center font-bold text-red-600">${(pos.red || []).join(' ') || '-'}</td>
                    <td class="p-2 text-center"><span class="text-[11px] px-2 py-0.5 font-bold rounded border ${res.class}">${res.text}</span></td>
                    <td class="p-2 text-center font-bold text-indigo-800">${(pos.white || []).join(' ') || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        fetchSpectatorData();
        setInterval(fetchSpectatorData, 5000);
    </script>
</body>
</html>
