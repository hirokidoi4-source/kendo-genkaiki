<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決勝トーナメント速報 - 少年剣道大会</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="common.js"></script>
    <style>
        /* 横スクロールバーを見やすくスムーズに */
        .tourney-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ナビバー -->
    <header class="bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="spectator.html" class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                    ← 予選・結果へ戻る
                </a>
                <h1 class="text-base sm:text-xl font-black flex items-center gap-2">
                    🏆 決勝トーナメント速報
                </h1>
            </div>
            <span class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> リアルタイム
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 space-y-6">
        <!-- 部門選択ボタン -->
        <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-2 items-center">
            <span class="text-xs font-black text-slate-400 px-2">対象部門:</span>
            <button onclick="switchCategory('low_elem')" id="btn-low_elem" class="cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600">① 小学生低学年</button>
            <button onclick="switchCategory('elem')" id="btn-elem" class="cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600">② 小学生高学年</button>
            <button onclick="switchCategory('mid')" id="btn-mid" class="cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600">③ 中学生団体</button>
            <button onclick="switchCategory('mid_girls')" id="btn-mid_girls" class="cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600">④ 中学生女子団体</button>
        </div>
        <div id="tournamentContainer" class="tourney-scroll pb-6">
            <div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">
                トーナメントデータを読み込み中...
            </div>
        </div>

        <!-- トーナメントカラム表示エリア（横スクロール対応） -->
    </main>

    <!-- 対戦詳細モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-indigo-900 text-white p-3 sm:p-4 flex justify-between items-center shrink-0">
                <h3 id="modalTitle" class="font-bold text-base">試合詳細</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white text-2xl font-bold px-2">&times;</button>
            </div>
            <div class="p-4 overflow-y-auto space-y-4">
                <div class="bg-slate-100 rounded-xl p-3 border flex justify-between items-center text-center">
                    <div class="w-5/12">
                        <div id="modalRedTeam" class="font-black text-sm text-red-700 truncate">赤チーム</div>
                        <div id="modalRedSummary" class="text-xs text-red-600 font-bold mt-0.5">-</div>
                    </div>
                    <div class="w-2/12 font-black text-xs text-slate-400">VS</div>
                    <div class="w-5/12">
                        <div id="modalWhiteTeam" class="font-black text-sm text-slate-800 truncate">白チーム</div>
                        <div id="modalWhiteSummary" class="text-xs text-slate-600 font-bold mt-0.5">-</div>
                    </div>
                </div>
                <table class="w-full text-xs sm:text-sm border-collapse">
                    <thead>
                        <tr class="border-b bg-slate-50 text-slate-500 font-bold">
                            <th class="p-2 text-center">位置</th>
                            <th class="p-2 text-center">赤 取得部位</th>
                            <th class="p-2 text-center">勝敗</th>
                            <th class="p-2 text-center">白 取得部位</th>
                        </tr>
                    </thead>
                    <tbody id="modalPositionRows"></tbody>
                </table>
            </div>
            <div class="p-3 bg-slate-50 border-t flex justify-end shrink-0">
                <button onclick="closeModal()" class="px-5 py-2 bg-slate-200 hover:bg-slate-300 rounded-xl text-xs sm:text-sm font-bold text-slate-700">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        const positions = ['先鋒', '次鋒', '中堅', '副将', '大将'];
        const stages = ['1回戦', '2回戦', '3回戦', '4回戦', '5回戦'];
        
        let currentCategoryKey = 'low_elem';
        let tournamentMatches = [];

        // 初期化: URLパラメータから部門をセット
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const cat = params.get('category');
            if (cat && ['low_elem', 'elem', 'mid', 'mid_girls'].includes(cat)) {
                currentCategoryKey = cat;
            }
            updateCategoryUi();
            fetchTournamentData();
            setInterval(fetchTournamentData, 5000);
        });

        function switchCategory(key) {
            currentCategoryKey = key;
            updateCategoryUi();
            fetchTournamentData();
        }

        function updateCategoryUi() {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition bg-slate-100 text-slate-600 hover:bg-slate-200";
            });
            const activeBtn = document.getElementById(`btn-${currentCategoryKey}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn px-4 py-2 rounded-xl font-black text-xs sm:text-sm transition bg-indigo-600 text-white shadow-sm";
            }
        }

        // 部門名（英名キーと日本語表記の相互チェック用）
        const categoryNamesMap = {
            'low_elem': '小学生低学年',
            'elem': '小学生高学年',
            'mid': '中学生団体',
            'mid_girls': '中学生女子団体'
        };

        // 👈 ★差し替え①: API(Supabase) + 全LocalStorageからデータを取得する強化版読み込み関数
        async function fetchTournamentData() {
            let rawMatches = [];
            const jpCategoryName = categoryNamesMap[currentCategoryKey] || '';

            // 1. API (Supabase /api/matches) からの取得を最優先で試行
            try {
                const res = await fetch('/api/matches');
                if (res.ok) {
                    const allMatches = await res.json();
                    rawMatches = allMatches.filter(m => {
                        const cat = m.category_key || m.category || '';
                        return cat === currentCategoryKey || cat === jpCategoryName;
                    });
                }
            } catch (e) {
                console.log('API取得オフライン - LocalStorageへフォールバックします');
            }

            // 2. APIでデータが無い場合、各種LocalStorageキーを網羅して検索
            if (!rawMatches || rawMatches.length === 0) {
                const storageKeys = [
                    `kendo_tournament_matches_${currentCategoryKey}`,
                    `kendo_tournament_${currentCategoryKey}`,
                    `kendo_matches_${currentCategoryKey}`,
                    `kendo_matches_${jpCategoryName}`,
                    'kendo_matches'
                ];

                for (const key of storageKeys) {
                    try {
                        const raw = localStorage.getItem(key);
                        if (raw) {
                            const parsed = JSON.parse(raw);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                rawMatches = parsed.filter(m => {
                                    const cat = m.category_key || m.category || '';
                                    return cat === currentCategoryKey || cat === jpCategoryName || !m.category;
                                });
                                if (rawMatches.length > 0) break;
                            }
                        }
                    } catch (e) {}
                }
            }

            // 3. 「〇〇リーグ」以外の決勝トーナメント対象試合のみに絞り込み
            tournamentMatches = rawMatches.filter(m => {
                const lg = m.league || m.stage || '';
                const title = m.title || '';
                // 予選リーグを除外し、トーナメントに関連するキーワード（回戦・決勝など）を含むか判定
                const isYosen = lg.includes('リーグ') || lg === '予選リーグ';
                const hasTourneyKeyword = /[1-9１-９]回戦|準決勝|決勝|トーナメント/.test(lg + ' ' + title);
                return !isYosen && (hasTourneyKeyword || lg !== '');
            });

            renderTournamentColumns();
        }

        // 👈 ★差し替え: 管理画面(final_input.html)と同一の回戦判定＆描画関数
        function renderTournamentColumns() {
            const container = document.getElementById('tournamentContainer');
            if (!tournamentMatches || tournamentMatches.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border">
                        対象部門の決勝トーナメントデータがまだ公開・保存されていません
                    </div>
                `;
                return;
            }

            // 1. 管理画面と同じロジック：タイトル("1回戦 第1試合"等)から正確に回戦(数値)を取得
            const roundMap = {};
            tournamentMatches.forEach(m => {
                let roundNum = 1;
                const safeTitle = m.title || '';

                // 「◯回戦」の文字を最優先で解析
                const titleMatch = safeTitle.match(/(\d+)回戦/);
                if (titleMatch) {
                    roundNum = parseInt(titleMatch[1], 10);
                } else if (safeTitle.includes('決勝') && !safeTitle.includes('準')) {
                    roundNum = 99;
                } else if (safeTitle.includes('準決勝')) {
                    roundNum = 98;
                } else {
                    roundNum = m.round || (m.details && m.details.round) || 1;
                }

                if (!roundMap[roundNum]) roundMap[roundNum] = [];
                roundMap[roundNum].push(m);
            });

            // 回戦の数字順（1 → 2 → 3 → ... → 98(準決勝) → 99(決勝)）にソート
            const sortedRounds = Object.keys(roundMap).sort((a, b) => Number(a) - Number(b));

            // ラウンド名自動決定
            const getRoundTitle = (rNum) => {
                const num = Number(rNum);
                if (num === 99) return '🏆 決勝';
                if (num === 98) return '準決勝';
                return `${num}回戦`;
            };

            // 2. 多列カラム（フレックスコンテナ）の生成
            container.innerHTML = `
                <div class="flex gap-6 items-start min-w-max px-1">
                    ${sortedRounds.map(rNum => {
                        // 試合ID順にソート
                        roundMap[rNum].sort((a, b) => (a.id || 0) - (b.id || 0));
                        return `
                            <div class="w-64 sm:w-72 bg-slate-200/60 rounded-2xl p-3 border border-slate-300/80 shadow-inner">
                                <h3 class="font-black text-center text-sm text-indigo-950 pb-2 mb-3 border-b border-slate-300">
                                    ${getRoundTitle(rNum)}
                                </h3>
                                <div class="space-y-3">
                                    ${roundMap[rNum].map(m => renderCard(m)).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }


        // 👈 ★差し替え: 通常勝利は「緑の[勝]」、代表戦は「オレンジの[代表勝]」で明確に仕分けるカード関数
        function renderCard(m) {
            const teamA = m.teamA || m.redTeam || m.team1 || '未定';
            const teamB = m.teamB || m.whiteTeam || m.team2 || '未定';
            const scoreA = (m.scoreA !== undefined && m.scoreA !== null) ? Number(m.scoreA) : 0;
            const scoreB = (m.scoreB !== undefined && m.scoreB !== null) ? Number(m.scoreB) : 0;

            const isFinished = m.status === 'finished' || (scoreA > 0 || scoreB > 0);

            // 💡 ★厳密化: 本当に「代表戦」での決着かを判定
            // (1) details.repWinner が有効、または (2) 0-0等で同点なのに details.winnerTeam が指定されている場合
            const repWinnerTeam = m.details?.winnerTeam || m.details?.repWinner || '';
            const isTieScore = (scoreA === scoreB);
            const isRepMatch = isFinished && repWinnerTeam !== '' && (m.details?.repWinner || isTieScore);

            // 💡 勝者判定: 通常のスコア差、または代表戦勝者と一致する場合
            const winA = isFinished && ((scoreA > scoreB) || (isRepMatch && repWinnerTeam === teamA));
            const winB = isFinished && ((scoreB > scoreA) || (isRepMatch && repWinnerTeam === teamB));

            // 💡 右上バッジ: 代表戦のときだけオレンジ色で警告表示
            let statusBadgeHtml = `<span class="text-[10px] px-2 py-0.5 rounded font-bold ${isFinished ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-100 text-slate-500'}">${isFinished ? '試合終了' : '試合前'}</span>`;
            if (isRepMatch) {
                statusBadgeHtml = `<span class="text-[10px] px-2 py-0.5 rounded font-black bg-amber-100 text-amber-800 border border-amber-300">⚠️ 代表戦決着</span>`;
            }

            // 💡 チーム名横の勝ちバッジ生成関数（代表戦=オレンジ、通常勝利=エメラルド緑）
            const getWinBadgeHtml = (isWinner) => {
                if (!isWinner) return '';
                if (isRepMatch) {
                    return `<span class="text-[10px] bg-amber-500 text-white px-1.5 py-0.5 rounded font-black ml-1.5 shadow-sm shrink-0">代表勝</span>`;
                }
                return `<span class="text-[10px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-black ml-1.5 shadow-sm shrink-0">勝</span>`;
            };

            return `
                <div onclick="openMatchModal('${m.id || ''}', ${m._idx})" class="bg-white rounded-xl p-3.5 border border-slate-200/80 shadow-sm transition-all cursor-pointer hover:border-indigo-500 hover:shadow-md hover:-translate-y-0.5">
                    <!-- 試合名 & バッジ -->
                    <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">
                        <span class="text-[11px] font-bold text-slate-500">${m.title || ''}</span>
                        ${statusBadgeHtml}
                    </div>

                    <!-- チームA -->
                    <div class="flex justify-between items-center py-1 ${winA ? 'font-black text-indigo-950' : 'text-slate-700'}">
                        <span class="text-sm truncate pr-1 flex items-center">
                            <span class="truncate">${teamA}</span>
                            ${getWinBadgeHtml(winA)}
                        </span>
                        <span class="text-sm font-bold ml-2 ${winA ? (isRepMatch ? 'text-amber-600' : 'text-emerald-700') : ''}">${scoreA}</span>
                    </div>

                    <!-- チームB -->
                    <div class="flex justify-between items-center py-1 ${winB ? 'font-black text-indigo-950' : 'text-slate-700'}">
                        <span class="text-sm truncate pr-1 flex items-center">
                            <span class="truncate">${teamB}</span>
                            ${getWinBadgeHtml(winB)}
                        </span>
                        <span class="text-sm font-bold ml-2 ${winB ? (isRepMatch ? 'text-amber-600' : 'text-emerald-700') : ''}">${scoreB}</span>
                    </div>
                </div>
            `;
        }

        // 【差し替え】 モーダルを開き、先鋒〜大将の正確な部位結果を描画する関数
        function openMatchModal(matchId, idx) {
            // ★ currentMatches ではなく正しい tournamentMatches を検索
            const m = tournamentMatches.find(x => String(x.id) === String(matchId)) || tournamentMatches[idx];
            if (!m) return;

            // 1. チーム名とトータル勝敗・本数の表示
            const teamA = m.teamA || m.redTeam || m.team1 || '未定';
            const teamB = m.teamB || m.whiteTeam || m.team2 || '未定';
            document.getElementById('modalTeamA').textContent = teamA;
            document.getElementById('modalTeamB').textContent = teamB;

            const winsA = (m.scoreA !== undefined && m.scoreA !== null) ? m.scoreA : (m.redWins || 0);
            const winsB = (m.scoreB !== undefined && m.scoreB !== null) ? m.scoreB : (m.whiteWins || 0);
            const ptsA = (m.honA !== undefined && m.honA !== null) ? m.honA : (m.redPoints || 0);
            const ptsB = (m.honB !== undefined && m.honB !== null) ? m.honB : (m.whitePoints || 0);

            document.getElementById('modalTotalA').textContent = `${winsA}勝 (${ptsA}本)`;
            document.getElementById('modalTotalB').textContent = `${winsB}勝 (${ptsB}本)`;

            // 2. 代表戦エリアの表示制御
            const repSection = document.getElementById('modalRepSection');
            const winnerTeam = m.details?.winnerTeam;
            const isTie = (winsA === winsB) && (ptsA === ptsB);

            if (repSection) {
                if (winnerTeam && (isTie || m.details?.repWinner)) {
                    repSection.classList.remove('hidden');
                    const repWinnerEl = document.getElementById('modalRepWinner');
                    if (repWinnerEl) repWinnerEl.textContent = `勝者： ${winnerTeam}`;
                } else {
                    repSection.classList.add('hidden');
                }
            }

            // 3. 部位データの安全な文字列化ヘルパー関数
            const formatScore = (val) => {
                if (Array.isArray(val)) {
                    const filtered = val.filter(v => v && v !== '');
                    return filtered.length > 0 ? filtered.join(' ') : '-';
                }
                return val && val !== '' ? String(val) : '-';
            };

            // 4. 先鋒〜大将の個人結果テーブルを描画（final_input.html とデータ構造を完全に一致！）
            const positionNames = ['先鋒', '次鋒', '中堅', '副将', '大将'];
            const tbody = document.getElementById('matchModalPositionRows');
            
            // ★ final_input.html で保存した m.details.scores を最優先で取得
            const savedScores = (m.details && m.details.scores) ? m.details.scores : (m.scores || {});

            if (tbody) {
                tbody.innerHTML = positionNames.map((name, i) => {
                    // 日本語ポジション名('先鋒'など) または 配列インデックス(0~4) のどちらでも安全にアクセス
                    const pos = savedScores[name] || savedScores[i] || {};

                    // ★ scoreA / scoreB を最優先で読み取る（過去のテストデータ用の red/white にもフォールバック）
                    const leftScore = formatScore(pos.scoreA || pos.red || pos.redScore || '');
                    const rightScore = formatScore(pos.scoreB || pos.white || pos.whiteScore || '');

                    return `
                        <tr class="border-b border-slate-100 last:border-b-0 hover:bg-slate-50/50 transition-colors">
                            <td class="py-3 px-2 text-center font-medium text-slate-800 text-sm md:text-base truncate">
                                ${leftScore}
                            </td>
                            <td class="py-3 px-1 text-center font-bold text-slate-500 bg-slate-50/80 text-xs md:text-sm border-x border-slate-100">
                                ${name}
                            </td>
                            <td class="py-3 px-2 text-center font-medium text-slate-800 text-sm md:text-base truncate">
                                ${rightScore}
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // 5. モーダルを表示（中央配置の flex クラスも正しく付与）
            const modal = document.getElementById('matchDetailModal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        // 👈 ★差し替え: モーダルを閉じる関数
        function closeMatchModal() {
            const modal = document.getElementById('matchDetailModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

    </script>
    <!-- 👁️ 管理画面UIを忠実に再現した試合詳細（閲覧専用）モーダル -->
    <div id="matchDetailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl border border-slate-300">
            <!-- モーダルヘッダー -->
            <div class="bg-[#1e293b] text-white p-3.5 text-center relative font-bold text-base sm:text-lg">
                <span id="modalMatchTitle">試合詳細</span>
                <button onclick="closeMatchModal()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-300 hover:text-white text-2xl font-bold">
                    ✕
                </button>
            </div>

            <!-- モーダルコンテンツ -->
            <div class="p-4 sm:p-6 overflow-y-auto max-h-[85vh]">
                <!-- 対戦表テーブル（管理画面の match-table スタイルを踏襲） -->
                <table class="w-full border-collapse border border-slate-300 mb-4 text-base table-fixed">
                    <thead>
                        <tr class="bg-[#f1f5f9] text-slate-800 border-b border-slate-300 font-bold">
                            <th id="modalTeamA" class="py-3 px-2 border border-slate-300 text-center w-[40%] text-indigo-950 truncate">チームA</th>
                            <th class="py-3 px-2 border border-slate-300 text-center w-[20%] text-sm text-slate-600">ポジション</th>
                            <th id="modalTeamB" class="py-3 px-2 border border-slate-300 text-center w-[40%] text-indigo-950 truncate">チームB</th>
                        </tr>
                    </thead>
                    <tbody id="matchModalPositionRows" class="divide-y divide-slate-100">
                        <!-- JSで先鋒〜大将の5行を動的生成 -->
                    </tbody>
                    <tfoot>
                        <tr class="bg-[#f1f5f9] font-bold border-t-2 border-slate-300 text-slate-800">
                            <td id="modalTotalA" class="py-3 px-2 border border-slate-300 text-center text-indigo-950">0勝 (0本)</td>
                            <td class="py-3 px-2 border border-slate-300 text-center text-sm text-slate-600">取得結果</td>
                            <td id="modalTotalB" class="py-3 px-2 border border-slate-300 text-center text-indigo-950">0勝 (0本)</td>
                        </tr>
                    </tfoot>
                </table>

                <!-- 代表戦表示エリア -->
                <div id="modalRepSection" class="hidden mb-6 p-3 bg-amber-50 border-2 border-amber-400 rounded-xl text-center">
                    <div class="text-xs font-bold text-amber-800 mb-1">⚠️ 代表戦による決着</div>
                    <div id="modalRepWinner" class="text-base font-black text-amber-950"></div>
                </div>

                <!-- 閉じるボタン -->
                <div class="flex justify-end">
                    <button onclick="closeMatchModal()" class="px-8 py-2.5 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-lg transition shadow">
                        閉じる
                    </button>
                </div>
            </div>
        </div>
    </div>
